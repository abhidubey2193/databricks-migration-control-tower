resources:
  jobs:
    smct_workspace_acceptance:
      name: '[SMCT] Serverless acceptance'
      max_concurrent_runs: 1
      tasks:
        - task_key: acceptance
          notebook_task:
            notebook_path: ../notebooks/workspace_acceptance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              action: assess
          environment_key: smct_accept
      environments:
        - environment_key: smct_accept
          spec:
            environment_version: '2'
            dependencies:
              - PyYAML==6.0.3
              - sqlglot==30.25.0
