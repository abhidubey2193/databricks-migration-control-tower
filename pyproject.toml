[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smct"
version = "0.1.0"
description = "Databricks Serverless Migration Control Tower"
requires-python = ">=3.10"
dependencies = ["databricks-sdk>=0.40", "pandas>=2.0", "pyyaml>=6.0", "sqlglot>=30,<31"]

[project.optional-dependencies]
app = ["streamlit>=1.35", "databricks-sql-connector>=3.0"]
spark = ["pyspark>=3.5,<4"]
scripts = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
smct = "smct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
