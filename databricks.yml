bundle:
  name: serverless-migration-control-tower
include:
  - resources/*.yml
variables:
  catalog:
    description: Existing writable Unity Catalog catalog, or auto for the execution principal current catalog
    default: auto
  schema:
    description: Sandbox-only destination schema
    default: serverless_migration
targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
